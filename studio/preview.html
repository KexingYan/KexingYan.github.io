<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draft Preview · Photography Studio</title>
  <meta name="description" content="Owner-only draft preview for the Photography archive." />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <link rel="stylesheet" href="/assets/photography/photography.css" />
  <link rel="stylesheet" href="/assets/studio/studio-preview.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <aside class="preview-ribbon" aria-label="Preview status">
    <strong>Draft preview</strong>
    <span>Owner-only draft state · nothing published</span>
    <button type="button" onclick="window.close()">Close preview</button>
  </aside>
  <header class="photo-header">
    <span>Kexing Yan</span>
    <span>Preview</span>
  </header>
  <main id="main-content">
    <section class="photo-intro" aria-labelledby="photography-title">
      <div><p class="photo-kicker">Visual Journal · Draft</p><h1 id="photography-title">Photo&shy;graphy</h1></div>
      <div class="intro-copy"><p class="intro-note">Things I noticed while wandering.</p><p class="intro-statement">Preview uses the same public-safe transform and visual system as Photography.</p></div>
    </section>
    <div id="preview-content"><p class="photo-status" role="status">Preparing local preview…</p></div>
  </main>
  <script type="module" src="/assets/studio/studio-preview.js"></script>
</body>
</html>
